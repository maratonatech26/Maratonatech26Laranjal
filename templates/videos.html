<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>HarpIA - Central de Vídeos</title>
    <link rel="stylesheet" href="/static/sub_style.css">
</head>
<body>
    <div class="container-topo">
        <a href="/" class="btn-voltar">&larr; Voltar ao Início</a>
        <h1>Canais de Cibersegurança</h1>
    </div>

    <div id="container-videos"></div>
      <script type="text/javascript" charset="utf-8">
    fetch('/api/videos')
  .then(res => res.json())
  .then(data => {
    if (data.sucesso) {
      const container = document.getElementById('container-videos');
      container.innerHTML = data.videos.map(video => `
        <div class="card-video">
          <iframe width="100%" height="200" src="https://www.youtube.com/embed/${video.id}" frameborder="0" allowfullscreen></iframe>
          <h3>${video.titulo}</h3>
        </div>
      `).join('');
    }
  });

  </script>
</body>
</html>
